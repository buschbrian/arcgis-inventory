name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windows is in the matrix on purpose: the target audience runs this on a
    # locked-down government workstation, and console encoding and path
    # construction are where that bites.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'

      - name: Test
        run: pytest --cov --cov-report=term-missing

  secrets-guard:
    # The repo's central constraint is that nothing organization-specific ever
    # lands in it. Enforce it in CI rather than trusting a rule to be remembered.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse crawl output and credentials
        run: |
          set -euo pipefail
          bad=$(git ls-files \
            | grep -Ei '(^|/)(output|screenshots|demo)/|\.(sqlite3?|db|env)$|^\.env' \
            || true)
          if [ -n "$bad" ]; then
            echo "::error::files that must never be committed are tracked:"
            echo "$bad"
            exit 1
          fi

      - name: Refuse non-example hostnames in fixtures and docs
        run: |
          set -euo pipefail
          # Fixtures and examples may only reference IANA-reserved names, so a
          # bug that makes a real request fails loudly instead of hitting
          # somebody's server -- and so no real org's URLs leak in.
          hits=$(grep -rInE 'https?://[a-z0-9.-]+' \
                   --include='*.py' --include='*.json' --include='*.yaml' \
                   --include='*.yml' --include='*.md' \
                   tests docs README.md env.example \
                 | grep -vE 'example\.(gov|com|org|net)|\.example[/"]|\.example$|localhost|127\.0\.0\.1' \
                 | grep -vE 'github\.com|arcgis\.com|esri\.com|iana\.org|opensource\.org|schemas?\.' \
                 || true)
          if [ -n "$hits" ]; then
            echo "::error::non-example hostname referenced:"
            echo "$hits"
            exit 1
          fi
