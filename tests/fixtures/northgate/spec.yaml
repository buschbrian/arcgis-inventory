# Northgate --- the synthetic fixture org.
#
# Source of truth. `build.py` expands this into the portal-shaped JSON tree
# alongside it. Both this file and the generated output are committed: tests
# read the JSON so a fixture change is legible in review, and the generator
# means adding a thirty-first item is not four hand-written files.
#
# Everything here is fictional. Hostnames are IANA-reserved (`.example`,
# `example.gov`) so a bug that makes a real request fails loudly instead of
# reaching somebody's server. Item ids are deterministic and obviously fake.
#
# The layer, field, and app vocabulary deliberately mirrors the municipal
# pattern anyone who has taken an Esri course will recognize --- parcels,
# zoning, storm and sanitary sewer, hydrants, address points, trees, plow
# routes. The shapes are familiar on purpose; the organization is not real.
#
# Every item below exists to exercise a specific failure mode. A fixture org of
# thirty plausible-but-uninteresting apps tests nothing.

org:
  name: City of Northgate
  portal_url: https://northgate.example.gov/portal
  online_url: https://northgate.maps.arcgis.example
  services_host: services.northgate.example.gov
  dev_host: gis-dev.northgate.example.gov
  legacy_host: maps.northgate.example.gov      # the one still on http://
  org_id: NgFiXtUrEoRg0001
  version: "11.4"
  kind: enterprise

users:
  - username: kmartinez_ng
    fullName: K. Martinez
    role: org_publisher
  - username: jokafor_ng
    fullName: J. Okafor
    role: org_publisher
  - username: dchen_ng
    fullName: D. Chen
    role: org_admin
  - username: rpatel_ng
    fullName: R. Patel
    role: org_user
  # Owns item 4 and appears in no user listing: the account is gone. This is
  # what `owner_exists = 0` and `v_orphaned` are for.
  - username: former_staff_ng
    fullName: (departed)
    exists: false

groups:
  - id: g0000000000000000000000000000001
    title: Public Works
  - id: g0000000000000000000000000000002
    title: Community Development
  - id: g0000000000000000000000000000003
    title: Public Web Content

# ---------------------------------------------------------------------------
# Services. These become `resource` rows with kind='endpoint' --- many are not
# portal items at all, which is exactly why the node table is unified.
# ---------------------------------------------------------------------------
services:
  - key: svc_parcels
    path: Public/Parcels/FeatureServer
    type: FeatureServer
    access: public
    layers:
      - { id: 0, name: Parcels }
      - { id: 1, name: Parcel Lines }
    exercises: "24 - hosted feature service, public. Baseline."

  - key: svc_zoning
    path: Public/Zoning/FeatureServer
    type: FeatureServer
    access: public
    layers:
      - { id: 0, name: Zoning Districts }
      - { id: 1, name: Overlay Districts }

  - key: svc_address_points
    path: Public/AddressPoints/FeatureServer
    type: FeatureServer
    access: public
    layers:
      - { id: 0, name: Address Points }

  # The target of the headline audit-sharing case: a public app reaches this,
  # and it is not public.
  - key: svc_dev_projects
    path: Internal/DevelopmentProjects/FeatureServer
    type: FeatureServer
    access: org
    layers:
      - { id: 0, name: Development Projects }
      - { id: 1, name: Plan Review Status }
    exercises: "25 - org-only hosted feature service. Target of case 5."

  - key: svc_storm_sewer
    path: Utilities/StormSewer/FeatureServer
    type: FeatureServer
    access: org
    layers:
      - { id: 0, name: Storm Structures }
      - { id: 1, name: Storm Mains }
      - { id: 2, name: Outfalls }

  - key: svc_sanitary_sewer
    path: Utilities/SanitarySewer/FeatureServer
    type: FeatureServer
    access: org
    layers:
      - { id: 0, name: Sanitary Manholes }
      - { id: 1, name: Sanitary Mains }

  - key: svc_water
    path: Utilities/WaterDistribution/FeatureServer
    type: FeatureServer
    access: org
    layers:
      - { id: 0, name: Hydrants }
      - { id: 1, name: Valves }
      - { id: 2, name: Water Mains }

  - key: svc_street_centerlines
    path: Public/StreetCenterlines/FeatureServer
    type: FeatureServer
    access: public
    layers:
      - { id: 0, name: Street Centerlines }
      - { id: 1, name: Street Names }

  - key: svc_traffic_signals
    path: Public/TrafficSignals/FeatureServer
    type: FeatureServer
    access: public
    layers:
      - { id: 0, name: Traffic Signals }
    exercises: "18's target - referenced by URL only, with no portal item."

  - key: svc_trees
    path: Public/TreeInventory/FeatureServer
    type: FeatureServer
    access: public
    layers:
      - { id: 0, name: Street Trees }

  - key: svc_plow_routes
    path: Public/PlowRoutes/FeatureServer
    type: FeatureServer
    access: public
    layers:
      - { id: 0, name: Plow Routes }
      - { id: 1, name: Route Status }

  - key: svc_precincts
    path: Public/VotingPrecincts/FeatureServer
    type: FeatureServer
    access: public
    layers:
      - { id: 0, name: Voting Precincts }
      - { id: 1, name: Polling Places }

  - key: svc_parks
    path: Public/Parks/FeatureServer
    type: FeatureServer
    access: public
    layers:
      - { id: 0, name: Parks }
      - { id: 1, name: Trails }

  - key: svc_bike_paths
    path: Public/BikePaths/FeatureServer
    type: FeatureServer
    access: public
    layers:
      - { id: 0, name: Bike Paths }

  - key: svc_buildings_3d
    path: Public/Buildings3D/SceneServer
    type: SceneServer
    access: public
    layers:
      - { id: 0, name: Building Footprints 3D }

  # Case 17: a web map points at this and it is gone.
  - key: svc_gone
    path: Utilities/StormSewer_OLD/MapServer
    type: MapServer
    access: public
    http_status: 404
    exercises: "17's target - reachability finding, reachable=0."

  # Case 7: still on http://, on the old server nobody has migrated.
  - key: svc_flood_legacy
    host: maps.northgate.example.gov
    scheme: http
    path: Public/FloodZones/MapServer
    type: MapServer
    access: public
    layers:
      - { id: 0, name: Floodplain }
      - { id: 1, name: Floodway }
    exercises: "26 - legacy MapServer over http://. Non-HTTPS finding."

  # Case 6: production app pointing at the dev box.
  - key: svc_utility_locate_dev
    host: gis-dev.northgate.example.gov
    path: Internal/UtilityLocate/FeatureServer
    type: FeatureServer
    access: org
    layers:
      - { id: 0, name: Locate Requests }
    exercises: "6's target - dev/staging host detection."

  - key: svc_geocode
    host: geocode.regional-gis.example.org
    path: Composite/NorthgateLocator/GeocodeServer
    type: GeocodeServer
    access: public
    exercises: "27 - geocode service on an external host. `geocoder` relation."

  - key: svc_gp_plow
    path: Tools/PlowRouteOptimizer/GPServer
    type: GPServer
    access: org
    exercises: "28 - GP service. `gp_service` relation."

  - key: svc_print
    path: Utilities/PrintingTools/GPServer
    type: GPServer
    access: public
    exercises: "29 - print service. `print_service` relation."

  # Case 20: a basemap from outside the org entirely.
  - key: svc_external_basemap
    host: basemaps.external-vendor.example.com
    path: Vector/CountyBasemap/MapServer
    type: MapServer
    access: public
    layers:
      - { id: 0, name: County Basemap }
    exercises: "20's target - external domain detection."

  # A very long path, near typical limits, to catch anything that truncates.
  - key: svc_long_path
    path: >-
      Internal/Engineering/CapitalImprovements/StormwaterManagement/DetentionBasins/
      InspectionHistory/2019Through2026/DetentionBasinInspectionHistoryArchive/FeatureServer
    type: FeatureServer
    access: org
    layers:
      - { id: 0, name: Detention Basin Inspections }
    exercises: "Very long service URL near typical path limits."

